[package]
name = "zk_spot_shield"
version = "0.1.0"
description = "ZK-shielded spot settlement engine (Anchor program)"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "zk_spot_shield"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# 1. Core Framework
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"

# 2. Zero-Copy RAM Management
bytemuck = { version = "1.16", features = ["derive"] }

# 3. SP1 On-Chain Verifier
sp1-solana = "0.1.0"

[dev-dependencies]
# Stay on 0.10 until a coordinated Agave/LiteSVM bump. 0.15+ needs matching
# solana-sysvar/wincode (0.5 vs 0.6) — Dependabot-only bumps fail clippy/tests.
litesvm = "=0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }