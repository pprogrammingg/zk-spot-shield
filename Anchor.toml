skip_local_validator = true

[toolchain]
# Explicit Anchor CLI pin (matches programs/zk_spot_shield anchor-lang).
# `avm solana install` maps it through AVM's Anchor→Solana map
# (1.1.2 → 3.1.10: Agave 3.x, platform-tools v1.52). Agave 4 / SBPFv3
# waits for the LiteSVM and platform-tools bump in programs/zk_spot_shield.
anchor_version = "1.1.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
zk_spot_shield = "H6X5T8TP6T8hyTySiDVAug8bfULbKGMhCTV5PA9VMHPv"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[workspace]
members = ["programs/zk_spot_shield"]

[scripts]
test = "cargo test -p zk_spot_shield"

[hooks]
