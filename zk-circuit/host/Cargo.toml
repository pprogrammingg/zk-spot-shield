[package]
name = "zk-circuit-host"
version = "0.1.0"
description = "SP1 host prover driver"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "zk_circuit_host"
path = "src/lib.rs"

[[bin]]
name = "zk-circuit-host"
path = "src/main.rs"

[dependencies]
dotenvy = "0.15"
sp1-sdk = { version = "6.5.0", features = ["network"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zk-circuit-io = { path = "../io" }
