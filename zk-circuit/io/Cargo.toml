[package]
name = "zk-circuit-io"
version = "0.1.0"
description = "Shared guest/host I/O types and Poseidon Merkle helpers (no sp1-zkvm)"
edition.workspace = true
# Shared with guest under `cargo prove` (`+succinct` ≈ 1.94.0-dev).
rust-version = "1.88.0"

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"] }
light-poseidon = { version = "0.2", default-features = false }
ark-bn254 = { version = "=0.4.0", default-features = false }
# Same 0.4 alias as the program crate: workspace host/SP1 also pull ark-ff 0.6.
ark-ff-04 = { package = "ark-ff", version = "=0.4.2", default-features = false }
