[workspace]
resolver = "2"
members = [
    "program",
    "zk-circuit/host",
    "client", "zk-circuit/guest",
]
default-members = [
    "program",
    "zk-circuit/host",
    "client",
]

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
overflow-checks = true
panic = "abort"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
