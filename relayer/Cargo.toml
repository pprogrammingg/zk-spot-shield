[package]
name = "zk-spot-shield-relayer"
version = "0.1.0"
description = "Fee-payer relayer: submit-intent → prove stub → settle tx (Days 44–47)"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "zk-spot-shield-relayer"
path = "src/main.rs"

[lib]
name = "zk_spot_shield_relayer"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"

# Day 46–47: settle tx build + fee payer (no network prove)
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"
zk_spot_shield = { path = "../programs/zk_spot_shield", default-features = false, features = ["no-entrypoint"] }
client = { path = "../client" }
solana-compute-budget-interface = "3.1.0"
solana-hash = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "3"
solana-pubkey = "3"
solana-signer = "3"
solana-transaction = { version = "3", features = ["bincode"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
