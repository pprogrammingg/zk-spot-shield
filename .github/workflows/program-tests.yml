name: Program tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: program-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  litesvm:
    name: anchor build + LiteSVM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml. dtolnay/rust-toolchain does not.
      - name: Install rust-toolchain.toml
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          cache-on-failure: true

      - name: Cache Solana CLI
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cargo/bin/avm
            ~/.cargo/bin/anchor
            ~/.avm
          key: solana-anchor-${{ runner.os }}-1.1.2-cli-tag

      - name: Install Solana CLI
        run: |
          if ! command -v solana >/dev/null 2>&1; then
            sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # Pin Anchor CLI to tag v1.1.2 (same as program/Cargo.toml). Unpinned git
      # HEAD of avm can require a newer rustc than this job.
      - name: Install Anchor CLI
        run: |
          if ! command -v anchor >/dev/null 2>&1; then
            cargo install --git https://github.com/coral-xyz/anchor --tag v1.1.2 anchor-cli --locked
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build BPF program
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version
          anchor --version
          anchor build

      - name: LiteSVM integration tests
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cargo test -p zk_spot_shield --tests --locked -- --nocapture
