name: Program tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: program-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  litesvm:
    name: anchor build + LiteSVM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # rustup reads rust-toolchain.toml. dtolnay/rust-toolchain does not.
      - name: Install rust-toolchain.toml
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          cache-on-failure: true

      - name: Cache Anchor and Solana CLIs
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cargo/bin/avm
            ~/.cargo/bin/anchor
            ~/.avm
          key: avm-solana-${{ hashFiles('Anchor.toml', 'programs/zk_spot_shield/Cargo.toml', 'Cargo.lock') }}-${{ runner.os }}

      # AVM from the release named in Anchor.toml, not git HEAD (HEAD can
      # require a newer rustc). The shim installs that Anchor CLI; Solana
      # comes from AVM's map. Non-interactive runners skip the install prompt.
      - name: Install Anchor and Solana
        run: |
          anchor_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Anchor.toml","rb"))["toolchain"]["anchor_version"])')
          test -n "$anchor_version"
          if ! command -v avm >/dev/null 2>&1; then
            cargo install --git https://github.com/solana-foundation/anchor --tag "v${anchor_version}" avm --locked --force
          fi
          # Creates ~/.cargo/bin/anchor as the AVM shim.
          avm --version
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$PATH"
          if ! anchor --version >/dev/null 2>&1; then
            avm install "$anchor_version"
          fi
          avm solana install
          anchor --version
          solana --version
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Build BPF program
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version
          anchor --version
          # Deploy keypair is gitignored; declare_id! in source is the program id
          # LiteSVM tests use. Skip keypair↔id check on fresh CI checkouts.
          anchor build --ignore-keys

      - name: LiteSVM integration tests
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cargo test -p zk_spot_shield --tests --locked -- --nocapture
