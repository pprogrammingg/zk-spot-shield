name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # rustup reads rust-toolchain.toml. dtolnay/rust-toolchain does not.
      - name: Install rust-toolchain.toml
        run: rustup show

      # Prebuilt cargo-audit: compiling latest cargo-audit from crates.io can
      # require a newer rustc than this job. Local `cargo audit` uses ~/.cargo/bin.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  clippy:
    name: clippy (program, io, client)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # rustup reads rust-toolchain.toml. dtolnay/rust-toolchain does not.
      - name: Install rust-toolchain.toml
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          cache-on-failure: true

      - name: Clippy
        run: |
          cargo clippy -p zk_spot_shield -p zk-circuit-io -p client --locked --all-targets -- -D warnings
