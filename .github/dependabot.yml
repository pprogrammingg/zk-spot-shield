version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # LiteSVM 0.14+ switched to wincode sysvars; needs an Agave-aligned stack,
      # not a lone version bump (breaks clippy --all-targets / program tests).
      - dependency-name: litesvm
        versions: [">=0.11.0"]
      # Poseidon leaf/Merkle APIs; bump only with intentional circuit Day + golden vectors.
      - dependency-name: light-poseidon
        versions: [">=0.3.0"]
      # ark 0.5+ is a coordinated algebra bump; keep with light-poseidon / program types.
      - dependency-name: ark-bn254
        versions: [">=0.5.0"]
      - dependency-name: ark-serialize
        versions: [">=0.5.0"]
      # Solana SDK 4+/5.x needs an Agave/Anchor/LiteSVM stack bump, not a lone crate bump.
      - dependency-name: solana-message
        versions: [">=4.0.0"]
      - dependency-name: solana-transaction
        versions: [">=4.0.0"]
      - dependency-name: solana-account
        versions: [">=4.0.0"]
      - dependency-name: solana-signer
        versions: [">=4.0.0"]
      - dependency-name: solana-keypair
        versions: [">=4.0.0"]
      # Host/guest SP1 pins; bump together with toolchain + audit.toml (ruzstd/object).
      - dependency-name: sp1-sdk
        versions: [">=6.6.0"]
      - dependency-name: sp1-zkvm
        versions: [">=6.6.0"]
